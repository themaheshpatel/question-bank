<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank</title>
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" defer></script>
<script src="questions.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --line: #dde2ea; --accent: #2457c5; --accent-soft: #e7eefc; --box: #f9fafc;
    --easy: #1f8a4c; --medium: #b7791f; --tough: #c53030; --warn-bg: #fff4e5; --warn: #8a4b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b5;
      --line: #2e3542; --accent: #7aa2ff; --accent-soft: #233150; --box: #161a22;
      --easy: #4cc283; --medium: #e0a84a; --tough: #f07171; --warn-bg: #3a2a12; --warn: #ffcf8a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { padding: 6px 0 14px; }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .step h2 { margin: 0 0 12px; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
  .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
         background: var(--accent); color: #fff; font-size: .85rem; }
  .row-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; font: inherit;
             text-align: left; color: var(--text); background: var(--panel); border: 1px solid var(--line);
             border-radius: 10px; cursor: pointer; }
  .row-btn:hover { border-color: var(--accent); }
  .row-btn .arrow { margin-left: 6px; color: var(--muted); transition: transform .15s; }
  .row-btn[aria-expanded="true"] { border-color: var(--accent); }
  .row-btn[aria-expanded="true"] .arrow { transform: rotate(90deg); }
  .row-btn .cnt { margin-left: auto; font-size: .8rem; color: var(--accent); }
  .subj { margin-bottom: 10px; }
  .subj > .row-btn { font-weight: 600; font-size: 1.02rem; }
  .box { border: 1px solid var(--line); border-radius: 10px; background: var(--box); padding: 10px; margin-top: 8px; }
  .chap { margin-bottom: 8px; }
  .chap:last-child { margin-bottom: 0; }
  .subs label { display: flex; align-items: flex-start; gap: 8px; padding: 4px 2px; cursor: pointer; }
  .subs .qc { margin-left: auto; color: var(--muted); font-size: .8rem; padding-left: 8px; white-space: nowrap; }
  input[type=checkbox] { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; }
  .tools { display: flex; gap: 8px; margin-bottom: 6px; }
  .mini { padding: 4px 10px; font: inherit; font-size: .8rem; border-radius: 6px; border: 1px solid var(--line);
          background: var(--panel); color: var(--text); cursor: pointer; }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .summary { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }
  .primary { padding: 11px 18px; font: inherit; font-weight: 600; border: 0; border-radius: 10px;
             background: var(--accent); color: #fff; cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { padding: 9px 14px; font: inherit; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .levels { display: flex; flex-wrap: wrap; gap: 10px; }
  .lvl-opt { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--line);
             border-radius: 10px; cursor: pointer; }
  .lvl-opt .qc { color: var(--muted); font-size: .8rem; }
  .field { margin-top: 14px; }
  .field > span { display: block; font-size: .9rem; margin-bottom: 6px; color: var(--muted); }
  .count-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .count-row input { width: 80px; padding: 8px; font: inherit; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--panel); color: var(--text); }
  .chip-btn { padding: 6px 12px; font: inherit; font-size: .85rem; border-radius: 999px; border: 1px solid var(--line);
              background: var(--panel); color: var(--text); cursor: pointer; }
  .chip-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .avail { margin-top: 10px; font-size: .9rem; }
  #warnings { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .88rem; }
  .note { font-size: .88rem; color: var(--muted); margin: 0 0 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--panel); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; font-size: .78rem; }
  .qno { font-weight: 700; font-size: .95rem; margin-right: 4px; }
  .tag { padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .plain { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .lvl { padding: 2px 8px; border-radius: 999px; color: #fff; font-weight: 600; }
  .l1 { background: var(--easy); } .l2 { background: var(--medium); } .l3 { background: var(--tough); }
  .qtext { overflow-x: auto; }
  ol.opts { list-style: upper-alpha; padding-left: 26px; margin: 8px 0; }
  ol.opts li { margin: 3px 0; }
  .qtext img, .sol img { max-width: 100%; height: auto; }
  details.sol { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  details.sol summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
  .sol .ans { font-weight: 600; margin: 6px 0; }
  mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="bankTitle">Question Bank</h1>
    <p>Choose a subject, open chapters, tick subtopics, then create your question set.</p>
  </header>

  <div id="warnings" hidden></div>

  <section class="step">
    <h2><span class="num">1</span> Choose subject, chapters and subtopics</h2>
    <div id="subjects"></div>
    <p class="summary" id="summary"></p>
    <div class="actions">
      <button class="primary" id="createBtn" disabled>Create questions</button>
      <button class="ghost" id="clearAll">Unselect everything</button>
    </div>
  </section>

  <section class="step" id="setup" hidden>
    <h2><span class="num">2</span> Level and number of questions</h2>
    <div class="levels" id="levels"></div>
    <div class="field">
      <span>How many questions?</span>
      <div class="count-row" id="countRow">
        <button class="chip-btn" data-n="5">5</button>
        <button class="chip-btn" data-n="10">10</button>
        <button class="chip-btn" data-n="15">15</button>
        <button class="chip-btn" data-n="20">20</button>
        <input type="number" id="howMany" min="1" value="5" aria-label="Number of questions">
      </div>
    </div>
    <div class="avail" id="avail"></div>
    <div class="actions">
      <button class="primary" id="showBtn">Show questions</button>
    </div>
  </section>

  <section class="step" id="results" hidden>
    <h2><span class="num">3</span> <span id="resTitle">Your questions</span></h2>
    <p class="note" id="resNote"></p>
    <div id="list"></div>
    <div class="actions">
      <button class="primary" id="newSet">New set</button>
      <button class="ghost" id="changeSel">Change selection</button>
    </div>
  </section>
</div>

<script>
(function () {
  const LEVELS = [1, 2, 3];
  const LEVEL_NAME = { 1: "Easy", 2: "Medium", 3: "Tough" };
  const SEP = " \u203A ";
  const key = (su, c, s) => su + "\u0000" + c + "\u0000" + s;
  const sel = new Set();
  const levelSel = new Set(LEVELS);
  const subjectNames = Object.keys(SUBJECTS);
  document.getElementById("bankTitle").textContent = (typeof BANK_TITLE !== "undefined" && BANK_TITLE) || "Question Bank";

  const qKeys = q => Object.entries(q.topics || {}).flatMap(([c, subs]) => (subs || []).map(s => key(q.subject, c, s)));

  // ---------- data checks (shown to the teacher if something is mistyped) ----------
  const problems = [], seen = new Set();
  QUESTIONS.forEach((q, i) => {
    const name = q.id || ("#" + (i + 1));
    if (!q.id) problems.push(name + ": missing id");
    else if (seen.has(q.id)) problems.push(name + ": duplicate id");
    seen.add(q.id);
    if (!LEVELS.includes(q.level)) problems.push(name + ": level must be 1, 2 or 3");
    const chapters = SUBJECTS[q.subject];
    if (!chapters) { problems.push(name + ': unknown subject "' + q.subject + '"'); return; }
    const entries = Object.entries(q.topics || {});
    if (!entries.length) problems.push(name + ": no chapters/subtopics");
    entries.forEach(([c, subs]) => {
      if (!chapters[c]) problems.push(name + ': chapter "' + c + '" is not in ' + q.subject);
      else if (!subs || !subs.length) problems.push(name + ': chapter "' + c + '" has no subtopic');
      else subs.forEach(s => { if (!chapters[c].includes(s)) problems.push(name + ': unknown subtopic "' + c + SEP + s + '"'); });
    });
  });
  if (problems.length) {
    const w = document.getElementById("warnings");
    w.hidden = false;
    w.innerHTML = "<strong>Data issues (" + problems.length + "):</strong><br>" + problems.map(esc).join("<br>");
  }

  const perSub = {};
  QUESTIONS.forEach(q => qKeys(q).forEach(k => perSub[k] = (perSub[k] || 0) + 1));

  // ---------- step 1: subject -> chapter -> subtopic boxes ----------
  const box = document.getElementById("subjects");
  box.innerHTML = subjectNames.map((su, a) => {
    const chapters = Object.keys(SUBJECTS[su]);
    return '<div class="subj">' +
      '<button class="row-btn" data-toggle="s' + a + '" aria-expanded="false"><span>' + esc(su) + '</span>' +
      '<span class="cnt" data-scnt="' + a + '"></span><span class="arrow">&#9656;</span></button>' +
      '<div class="box" id="s' + a + '" hidden>' + chapters.map((c, b) =>
        '<div class="chap">' +
        '<button class="row-btn" data-toggle="c' + a + '_' + b + '" aria-expanded="false"><span>' + esc(c) + '</span>' +
        '<span class="cnt" data-ccnt="' + a + '_' + b + '"></span><span class="arrow">&#9656;</span></button>' +
        '<div class="box subs" id="c' + a + '_' + b + '" hidden>' +
        '<div class="tools"><button class="mini" data-act="all" data-a="' + a + '" data-b="' + b + '">Select all</button>' +
        '<button class="mini" data-act="none" data-a="' + a + '" data-b="' + b + '">Unselect all</button></div>' +
        SUBJECTS[su][c].map((s, d) =>
          '<label><input type="checkbox" data-a="' + a + '" data-b="' + b + '" data-d="' + d + '"><span>' + esc(s) + '</span>' +
          '<span class="qc">' + (perSub[key(su, c, s)] || 0) + ' Q</span></label>').join("") +
        '</div></div>').join("") +
      '</div></div>';
  }).join("");

  const chapName = (a, b) => Object.keys(SUBJECTS[subjectNames[a]])[b];

  box.addEventListener("click", e => {
    const t = e.target.closest("[data-toggle]");
    if (t) {
      const panel = document.getElementById(t.dataset.toggle);
      panel.hidden = !panel.hidden;
      t.setAttribute("aria-expanded", String(!panel.hidden));
      return;
    }
    const m = e.target.closest(".mini");
    if (m) {
      const su = subjectNames[m.dataset.a], c = chapName(m.dataset.a, m.dataset.b);
      SUBJECTS[su][c].forEach(s => m.dataset.act === "all" ? sel.add(key(su, c, s)) : sel.delete(key(su, c, s)));
      refresh();
    }
  });
  box.addEventListener("change", e => {
    const i = e.target;
    if (i.type !== "checkbox") return;
    const su = subjectNames[i.dataset.a], c = chapName(i.dataset.a, i.dataset.b), s = SUBJECTS[su][c][i.dataset.d];
    i.checked ? sel.add(key(su, c, s)) : sel.delete(key(su, c, s));
    refresh();
  });
  document.getElementById("clearAll").onclick = () => { sel.clear(); refresh(); };

  // A question qualifies only if EVERY concept it uses is selected.
  const inSelection = q => { const ks = qKeys(q); return ks.length > 0 && ks.every(k => sel.has(k)); };

  function refresh() {
    let subTotal = 0;
    subjectNames.forEach((su, a) => {
      let sCount = 0;
      Object.keys(SUBJECTS[su]).forEach((c, b) => {
        const subs = SUBJECTS[su][c];
        const on = subs.filter(s => sel.has(key(su, c, s))).length;
        sCount += on;
        box.querySelector('[data-ccnt="' + a + '_' + b + '"]').textContent = on ? on + "/" + subs.length + " selected" : "";
        subs.forEach((s, d) => { box.querySelector('input[data-a="' + a + '"][data-b="' + b + '"][data-d="' + d + '"]').checked = sel.has(key(su, c, s)); });
      });
      box.querySelector('[data-scnt="' + a + '"]').textContent = sCount ? sCount + " subtopic" + (sCount > 1 ? "s" : "") : "";
      subTotal += sCount;
    });
    const matching = QUESTIONS.filter(inSelection).length;
    document.getElementById("summary").textContent = subTotal
      ? subTotal + " subtopic" + (subTotal > 1 ? "s" : "") + " selected. " + matching + " question" + (matching === 1 ? "" : "s") + " available."
      : "Nothing selected yet. Tap a subject to begin.";
    document.getElementById("createBtn").disabled = subTotal === 0;
    if (subTotal === 0) document.getElementById("setup").hidden = true;
    updateLevels();
  }

  // ---------- step 2: level + how many ----------
  const lvBox = document.getElementById("levels");
  lvBox.innerHTML = LEVELS.map(L =>
    '<label class="lvl-opt"><input type="checkbox" data-level="' + L + '" checked><span class="lvl l' + L + '">' + LEVEL_NAME[L] +
    '</span><span class="qc" data-lc="' + L + '"></span></label>').join("");
  lvBox.addEventListener("change", e => {
    const L = Number(e.target.dataset.level);
    e.target.checked ? levelSel.add(L) : levelSel.delete(L);
    updateLevels();
  });

  const howMany = document.getElementById("howMany");
  const countRow = document.getElementById("countRow");
  countRow.addEventListener("click", e => {
    const b = e.target.closest(".chip-btn");
    if (!b) return;
    howMany.value = b.dataset.n;
    markChips();
    updateLevels();
  });
  howMany.addEventListener("input", () => { markChips(); updateLevels(); });
  function markChips() { countRow.querySelectorAll(".chip-btn").forEach(b => b.classList.toggle("on", b.dataset.n === howMany.value)); }

  const pool = () => QUESTIONS.filter(q => inSelection(q) && levelSel.has(q.level));

  function updateLevels() {
    const base = QUESTIONS.filter(inSelection);
    LEVELS.forEach(L => { lvBox.querySelector('[data-lc="' + L + '"]').textContent = base.filter(q => q.level === L).length + " Q"; });
    const p = pool().length, want = parseInt(howMany.value, 10) || 0;
    const av = document.getElementById("avail");
    if (!levelSel.size) av.textContent = "Pick at least one level.";
    else if (!p) av.textContent = "No questions match this selection yet.";
    else if (want > p) av.textContent = p === 1 ? "Only 1 question available; it will be shown." : "Only " + p + " questions available; all " + p + " will be shown.";
    else av.textContent = p + " questions available. " + want + " will be picked at random.";
    document.getElementById("showBtn").disabled = !p || !levelSel.size || want < 1;
  }

  document.getElementById("createBtn").onclick = () => {
    const s = document.getElementById("setup");
    s.hidden = false;
    updateLevels();
    s.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  // ---------- step 3: show the set ----------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function makeSet() {
    const p = pool(), want = parseInt(howMany.value, 10) || 0;
    const n = Math.min(want, p.length);
    const picked = shuffle(p.slice()).slice(0, n).sort((x, y) => x.level - y.level || String(x.id).localeCompare(String(y.id)));
    document.getElementById("resTitle").textContent = "Your questions (" + n + ")";
    document.getElementById("resNote").textContent = n < want
      ? "You asked for " + want + ", but only " + n + (n === 1 ? " matches" : " match") + " your selection and levels."
      : "Picked at random from " + p.length + " matching questions. Press New set for a different set.";
    const list = document.getElementById("list");
    list.innerHTML = picked.map((q, i) => card(q, i + 1)).join("");
    const r = document.getElementById("results");
    r.hidden = false;
    r.scrollIntoView({ behavior: "smooth", block: "start" });
    if (window.MathJax && MathJax.typesetPromise) {
      MathJax.typesetClear && MathJax.typesetClear([list]);
      MathJax.typesetPromise([list]).catch(err => console.error(err));
    }
  }
  document.getElementById("showBtn").onclick = makeSet;
  document.getElementById("newSet").onclick = makeSet;
  document.getElementById("changeSel").onclick = () => document.querySelector(".step").scrollIntoView({ behavior: "smooth" });

  function card(q, no) {
    const entries = Object.entries(q.topics);
    const tags = entries.flatMap(([c, subs]) => subs.map(s => '<span class="tag">' + esc(c + SEP + s) + '</span>')).join("");
    const mixed = entries.length > 1 ? '<span class="plain">Mixed</span>' : "";
    const type = q.type ? '<span class="plain">' + esc(q.type) + '</span>' : "";
    const opts = Array.isArray(q.options) && q.options.length
      ? '<ol class="opts">' + q.options.map(o => "<li>" + o + "</li>").join("") + "</ol>" : "";
    const sol = (q.answer || q.solution)
      ? '<details class="sol"><summary>Show answer &amp; solution</summary>' +
        (q.answer ? '<div class="ans">Answer: ' + q.answer + '</div>' : "") +
        (q.solution ? '<div>' + q.solution + '</div>' : "") + '</details>' : "";
    return '<article class="card"><div class="meta"><span class="qno">Q' + no + '.</span>' +
      '<span class="lvl l' + q.level + '">' + LEVEL_NAME[q.level] + '</span>' +
      '<span class="plain">' + esc(q.subject) + '</span>' + type + mixed + tags +
      '<span class="plain">' + esc(q.id) + '</span></div>' +
      '<div class="qtext">' + q.question + '</div>' + opts + sol + '</article>';
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  markChips();
  refresh();
})();
</script>
</body>
</html>
